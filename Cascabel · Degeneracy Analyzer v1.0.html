<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self' blob:; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<meta name="theme-color" content="#0a0a0b">
<meta name="description" content="Instrumento para el diagnóstico de degeneración K-α en ajustes de Hill y modelos de saturación.">
<title>Cascabel · Degeneracy Analyzer v1.0</title>

<style>
/* ============================================================
   DISEÑO — decisiones de CSS
   ============================================================
   Sin framework. Custom properties semánticas. color-mix() y :has()
   para modernizar sin dependencias. Mobile-first en las queries.
   ============================================================ */

:root{
  --bg:#0a0a0b;
  --surface:#14141a;
  --surface-2:#1a1a22;
  --border:#26262e;
  --fg:#e5e5e7;
  --fg-muted:#8a8a93;
  --accent:#f5a623;
  --danger:#e5484d;
  --warn:#f5a623;
  --ok:#30a46c;
  --mono:ui-monospace,'JetBrains Mono',Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r-sm:5px; --r-md:8px; --r-lg:12px;
  --tap:44px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* Utilidad para lectores de pantalla. */
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

cascabel-app{
  display:grid;
  grid-template-columns:380px 1fr;
  min-height:100vh;
}

cascabel-app, cascabel-sidebar, cascabel-main,
cascabel-panel, cascabel-toast{ display:block; }

cascabel-sidebar{
  border-right:1px solid var(--border);
  padding:var(--s4);
  overflow-y:auto;
  max-height:100vh;
}
cascabel-main{
  padding:var(--s4);
  overflow-y:auto;
  max-height:100vh;
}
cascabel-panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:var(--s3);
  margin-bottom:var(--s3);
}
cascabel-panel[hidden]{ display:none !important; }

cascabel-panel > header{
  display:flex; justify-content:space-between; align-items:center;
  font-size:11px; font-weight:500; color:var(--fg-muted);
  text-transform:uppercase; letter-spacing:0.1em;
  margin-bottom:var(--s3);
}
cascabel-panel > header > span{
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
cascabel-panel > header > button.dl{
  font-size:10px; padding:3px 8px;
  text-transform:none; letter-spacing:0; font-weight:400;
  width:auto; flex-shrink:0;
}

h1{margin:0;font-size:17px;font-weight:500;letter-spacing:-0.01em}
h1 span{color:var(--fg-muted);font-weight:400}

label{display:block;font-size:11px;color:var(--fg-muted);
  margin-bottom:var(--s1);text-transform:uppercase;letter-spacing:0.06em}

input,select,textarea,button{
  font-family:var(--mono); font-size:12px;
  background:var(--bg); color:var(--fg);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  padding:var(--s2) var(--s3);
  width:100%;
}
textarea{min-height:140px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}

button{
  cursor:pointer;
  transition:border-color 0.15s, color 0.15s, background 0.15s;
  width:auto;
  min-height:36px;
}
button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
button.primary{
  background:var(--accent);color:#000;border-color:var(--accent);
  font-weight:600;
}
button.primary:hover:not(:disabled){background:#f5b440;color:#000}
button:disabled{opacity:.4;cursor:not-allowed}
button.icon{padding:var(--s1) var(--s2);font-size:11px;min-height:0}

cascabel-panel:has(input[type="checkbox"]:checked){
  border-color:color-mix(in srgb, var(--accent) 40%, var(--border));
}

table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
th,td{padding:var(--s2);text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--fg-muted);font-size:10px;text-transform:uppercase;letter-spacing:0.08em}
td.num{text-align:right}

.row{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s2)}
.row>button{flex:1 1 auto;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.muted{color:var(--fg-muted);font-size:12px}
.note{font-size:11px;color:var(--fg-muted);margin-top:var(--s2);line-height:1.45}
.hidden{display:none !important}

.verdict{padding:var(--s3);border-radius:var(--r-sm);border-left:3px solid;font-size:13px}
.verdict.ok{background:color-mix(in srgb, var(--ok) 8%, transparent);border-color:var(--ok)}
.verdict.warn{background:color-mix(in srgb, var(--warn) 8%, transparent);border-color:var(--warn)}
.verdict.danger{background:color-mix(in srgb, var(--danger) 8%, transparent);border-color:var(--danger)}
.verdict strong{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}

.metric{display:flex;justify-content:space-between;padding:var(--s1) 0;
  border-bottom:1px dashed var(--border);font-size:12px;gap:var(--s2)}
.metric:last-child{border-bottom:none}
.metric .label{color:var(--fg-muted);flex-shrink:0}
.metric .value{font-family:var(--mono);text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

svg{display:block;max-width:100%;height:auto}
.plot-wrap{background:var(--bg);border-radius:var(--r-sm);padding:var(--s1);overflow-x:auto}

cascabel-toast{
  position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));
  right:calc(20px + env(safe-area-inset-right));
  left:calc(20px + env(safe-area-inset-left));
  max-width:340px;
  margin-left:auto;
  background:var(--surface-2);border:1px solid var(--accent);
  padding:var(--s3) var(--s4);border-radius:var(--r-sm);
  font-size:12px;font-family:var(--mono);
  opacity:0;transition:opacity .2s;
  pointer-events:none;z-index:100;
  box-shadow:0 8px 24px rgba(0,0,0,0.5);
}
cascabel-toast.show{opacity:1}

.spinner{display:inline-block;width:12px;height:12px;
  border:2px solid var(--fg-muted);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;
  vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

cascabel-sidebar > .app-header{
  display:flex; justify-content:space-between; align-items:center;
  gap:var(--s3); margin-bottom:var(--s4); flex-wrap:wrap;
}
cascabel-sidebar > .app-header .seedbar{
  display:flex; align-items:center; gap:var(--s2);
  font-family:var(--mono); font-size:12px;
}
cascabel-sidebar > .app-header .seedbar input{ width:90px; }
cascabel-sidebar > .app-header .seedbar button{
  padding:5px 10px; font-size:11px; min-height:0;
}

@media (max-width: 900px){
  cascabel-app{
    grid-template-columns:1fr;
    min-height:auto;
  }
  cascabel-sidebar{
    border-right:none;
    border-bottom:1px solid var(--border);
    max-height:none;
    padding:var(--s3);
  }
  cascabel-main{
    max-height:none;
    padding:var(--s3);
  }
  body{ overflow-y:auto; }
  input,select,textarea{ font-size:16px; }
  button{ font-size:13px; min-height:var(--tap); }
  cascabel-panel > header > button.dl{
    min-height:0;
    font-size:11px;
    padding:6px 10px;
  }
}
@media (max-width: 600px){
  .grid2{ grid-template-columns:1fr }
  .row{ flex-direction:column; align-items:stretch; }
  .row>button{ width:100%; }
  cascabel-toast{
    right:calc(12px + env(safe-area-inset-right));
    left:calc(12px + env(safe-area-inset-left));
    max-width:none;
    font-size:13px;
  }
  h1{ font-size:15px }
  cascabel-sidebar > .app-header .seedbar input{ width:80px }
}
@media (max-height: 500px) and (orientation: landscape){
  cascabel-sidebar, cascabel-main{ padding:var(--s2) }
  cascabel-panel{ margin-bottom:var(--s2); padding:var(--s2) }
}
@media (prefers-reduced-motion: reduce){
  .spinner{ animation:none }
  cascabel-toast{ transition:none }
  *{ transition-duration:0.01ms !important }
}
</style>
</head>
<body>

<cascabel-app>
  <cascabel-sidebar>
    <div class="app-header">
      <h1>Cascabel <span>· v1.0</span></h1>
      <div class="seedbar">
        <label for="seedInput" style="margin:0">seed</label>
        <input type="number" id="seedInput" value="42" min="0" max="999999999" inputmode="numeric">
        <button id="reseedBtn" title="Nueva semilla" aria-label="Generar nueva semilla aleatoria">↻</button>
      </div>
    </div>

    <cascabel-panel data-title="Modelo">
      <label for="modelSelect">Ecuación</label>
      <select id="modelSelect" aria-describedby="modelNote"></select>
      <div class="note" id="modelNote" role="note"></div>
    </cascabel-panel>

    <cascabel-panel data-title="Presets">
      <div class="row" id="presets" role="group" aria-label="Presets de datos"></div>
    </cascabel-panel>

    <cascabel-panel data-title="Datos · A">
      <textarea id="dataInput" spellcheck="false" autocapitalize="off" autocorrect="off"
        aria-describedby="dataNote"
        placeholder="0.1, 0.02&#10;0.3, 0.08&#10;1.0, 0.31&#10;3.0, 0.72&#10;10.0, 0.94"></textarea>
      <div class="note" id="dataNote">x, y[, sigma[, n]] por línea. # para comentar (inline o al principio).</div>
    </cascabel-panel>

    <cascabel-panel data-title="Persistencia">
      <div class="row">
        <button id="saveBtn">Guardar</button>
        <button id="loadBtn">Cargar</button>
        <button id="clearDbBtn">Borrar</button>
      </div>
      <div class="note" id="dbNote">IndexedDB · sin guardados</div>
    </cascabel-panel>

    <cascabel-panel data-title="Acciones">
      <div class="row">
        <button class="primary" id="fitBtn">Ajustar y diagnosticar</button>
      </div>
      <div class="row">
        <button id="extrapolateBtn" disabled>Extrapolar rango</button>
      </div>
      <div class="note" id="progressNote" role="status" aria-live="polite"></div>
    </cascabel-panel>

    <cascabel-panel data-title="Diagnóstico">
      <div id="diagnostics" role="status" aria-live="polite"><div class="muted">Sin datos.</div></div>
    </cascabel-panel>
  </cascabel-sidebar>

  <cascabel-main>
    <cascabel-panel data-title="Ajuste" data-download="fit">
      <div class="plot-wrap" id="fitPlot"><div class="muted">Sin ajuste.</div></div>
    </cascabel-panel>

    <div class="grid2">
      <cascabel-panel data-title="Parámetros">
        <div id="paramTable"><div class="muted">Sin datos.</div></div>
      </cascabel-panel>
      <cascabel-panel data-title="Veredicto">
        <div id="verdict" role="status" aria-live="polite"><div class="muted">Sin datos.</div></div>
      </cascabel-panel>
    </div>

    <cascabel-panel data-title="Elipse de confianza" data-download="ellipse">
      <div class="plot-wrap" id="ellipsePlot"><div class="muted">Sin datos.</div></div>
    </cascabel-panel>

    <div class="grid2">
      <cascabel-panel data-title="Perfil · p1">
        <div class="plot-wrap" id="profileK"></div>
      </cascabel-panel>
      <cascabel-panel data-title="Perfil · p2">
        <div class="plot-wrap" id="profileA"></div>
      </cascabel-panel>
    </div>

    <cascabel-panel data-title="Extrapolación" id="extrapPanel" hidden data-download="extrap">
      <div class="plot-wrap" id="extrapPlot"></div>
      <div class="note" id="extrapNote"></div>
    </cascabel-panel>

    <cascabel-panel data-title="Manifest">
      <div id="manifestBox"><div class="muted">Sin ejecuciones.</div></div>
      <div class="row" style="margin-top:8px">
        <button id="exportJsonBtn">JSON</button>
        <button id="exportBootstrapBtn">Bootstrap CSV</button>
      </div>
    </cascabel-panel>

    <cascabel-panel data-title="Tests internos">
      <div id="testBanner" role="status" aria-live="polite"><div class="muted">No ejecutados.</div></div>
      <div class="row" style="margin-top:8px">
        <button id="runTestsBtn">Ejecutar tests</button>
      </div>
    </cascabel-panel>
  </cascabel-main>
</cascabel-app>

<cascabel-toast id="toast" role="status" aria-live="polite" aria-atomic="true"></cascabel-toast>

<script type="module">
// @ts-check

/* ============================================================
   CASCABEL v1.0 — Decision Log
   ============================================================
   Correcciones finales sobre v1.0:
   - Manifest: run_id sin timestamp dentro del hash.
   - BCa: activo con N ≤ 40 (jackknife barato), percentil si N > 40.
   - Tests: cobertura real (bootstrap, perfil, extrapolación, BCa).
   - Accesibilidad: aria-label, role, aria-live, aria-describedby.
   - Worker: terminate() + revocación del Blob URL en beforeunload.
   - Parser: comentarios inline con # (escapable con \#).
   ============================================================ */

/* ============================================================
   §1  UTILIDADES NUMÉRICAS
   ============================================================ */

function createPrng(seed){
  let s = seed >>> 0;
  return function(){
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const Stats = {
  mean(a){ let s=0; for(const v of a) s+=v; return s/a.length; },
  stdev(a){
    const m = this.mean(a);
    let s2=0; for(const v of a) s2 += (v-m)**2;
    return Math.sqrt(s2 / Math.max(1, a.length-1));
  },
  percentile(sorted, p){
    const i = (sorted.length - 1) * p;
    const lo = Math.floor(i), hi = Math.ceil(i);
    return lo === hi ? sorted[lo] : sorted[lo]*(hi-i) + sorted[hi]*(i-lo);
  },
  corr(a, b){
    if(!a||!b||a.length<2||a.length!==b.length) return 0;
    const ma = this.mean(a), mb = this.mean(b);
    let num=0, da=0, db=0;
    for(let i=0;i<a.length;i++){
      const u=a[i]-ma, v=b[i]-mb;
      num+=u*v; da+=u*u; db+=v*v;
    }
    return (da>0 && db>0) ? num/Math.sqrt(da*db) : 0;
  },
};

function gaussian(rng){
  let u=0,v=0;
  while(u===0) u=rng();
  while(v===0) v=rng();
  return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
}

const clamp01 = v => Math.max(1e-6, Math.min(1-1e-6, v));

/* ============================================================
   §2  ÁLGEBRA LINEAL
   ============================================================ */

function solveLinear(A, b){
  const n = A.length;
  const M = A.map((row, i) => [...row, b[i]]);
  for(let col=0; col<n; col++){
    let piv = col;
    for(let r=col+1; r<n; r++){
      if(Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
    }
    if(Math.abs(M[piv][col]) < 1e-14) return null;
    [M[col], M[piv]] = [M[piv], M[col]];
    for(let r=col+1; r<n; r++){
      const f = M[r][col] / M[col][col];
      for(let c=col; c<=n; c++) M[r][c] -= f * M[col][c];
    }
  }
  const x = new Array(n).fill(0);
  for(let i=n-1; i>=0; i--){
    let s = M[i][n];
    for(let j=i+1; j<n; j++) s -= M[i][j] * x[j];
    x[i] = s / M[i][i];
  }
  return x;
}

function solveQR(A, b){
  const m = A.length, n = A[0].length;
  const R = A.map((row, i) => [...row, b[i]]);
  for(let k=0; k<n; k++){
    let norm = 0;
    for(let i=k; i<m; i++) norm += R[i][k]*R[i][k];
    norm = Math.sqrt(norm);
    if(norm < 1e-14) continue;
    const alpha = R[k][k] > 0 ? -norm : norm;
    const v = new Array(m).fill(0);
    v[k] = R[k][k] - alpha;
    for(let i=k+1; i<m; i++) v[i] = R[i][k];
    let vNorm2 = 0;
    for(let i=k; i<m; i++) vNorm2 += v[i]*v[i];
    if(vNorm2 < 1e-14) continue;
    for(let j=k; j<=n; j++){
      let dot = 0;
      for(let i=k; i<m; i++) dot += v[i] * R[i][j];
      const factor = 2 * dot / vNorm2;
      for(let i=k; i<m; i++) R[i][j] -= factor * v[i];
    }
  }
  const x = new Array(n).fill(0);
  for(let i=n-1; i>=0; i--){
    let s = R[i][n];
    for(let j=i+1; j<n; j++) s -= R[i][j]*x[j];
    if(Math.abs(R[i][i]) < 1e-14) return null;
    x[i] = s / R[i][i];
  }
  return x;
}

/* ============================================================
   §3  FITTER
   ============================================================ */

const Fitter = {
  rss(xs, ys, p, ws, model){
    let s = 0;
    for(let i=0; i<xs.length; i++){
      const r = ys[i] - model.eval(p, xs[i]);
      s += (ws && ws[i] != null) ? ws[i]*r*r : r*r;
    }
    return s;
  },

  lmOnce(xs, ys, ws, init, model, maxIter = 300, tol = 1e-11){
    let p = [...init];
    let lambda = 1e-3;
    let rss = this.rss(xs, ys, p, ws, model);
    const N = xs.length, D = p.length;
    let it = 0;

    for(it=0; it<maxIter; it++){
      const J = [], r = [];
      for(let i=0; i<N; i++){
        const Ji = model.jacobian(p, xs[i]);
        const w = (ws && ws[i] != null) ? Math.sqrt(ws[i]) : 1;
        J.push(Ji.map(v => v * w));
        r.push((ys[i] - model.eval(p, xs[i])) * w);
      }
      const sqrtL = Math.sqrt(lambda);
      const Aug = J.map((row, i) => [...row, r[i]]);
      for(let k=0; k<D; k++){
        const extra = new Array(D).fill(0);
        extra[k] = sqrtL;
        extra.push(0);
        Aug.push(extra);
      }
      const A = Aug.map(row => row.slice(0, D));
      const bb = Aug.map(row => row[D]);
      const dx = solveQR(A, bb);
      if(!dx){ lambda *= 10; if(lambda > 1e14) break; continue; }
      const newP = p.map((v, i) => v + dx[i]);
      const newRss = this.rss(xs, ys, newP, ws, model);
      if(newRss < rss){
        const rel = (rss - newRss) / (rss + 1e-12);
        p = newP; rss = newRss;
        lambda = Math.max(lambda/10, 1e-12);
        if(rel < tol) return { params: p, rss, converged: true, iterations: it };
      } else {
        lambda *= 10;
        if(lambda > 1e14) break;
      }
    }
    return { params: p, rss, converged: false, iterations: it };
  },

  fit(xs, ys, ws, model){
    const starts = model.starts(xs, ys);
    let best = null;
    for(const s of starts){
      const r = this.lmOnce(xs, ys, ws, s, model, 150, 1e-10);
      if(!best || r.rss < best.rss) best = r;
    }
    if(best){
      const refined = this.lmOnce(xs, ys, ws, best.params, model, 400, 1e-12);
      if(refined.rss < best.rss) best = refined;
    }
    return best;
  },

  optimizeHeld(xs, ys, ws, model, currentP, freeIdxs){
    const subModel = {
      eval: (subP, x) => {
        const full = [...currentP];
        for(let i=0;i<freeIdxs.length;i++) full[freeIdxs[i]] = subP[i];
        return model.eval(full, x);
      },
      jacobian: (subP, x) => {
        const full = [...currentP];
        for(let i=0;i<freeIdxs.length;i++) full[freeIdxs[i]] = subP[i];
        const fullJ = model.jacobian(full, x);
        return freeIdxs.map(i => fullJ[i]);
      },
      starts: () => [freeIdxs.map(i => currentP[i])],
    };
    const subInit = freeIdxs.map(i => currentP[i]);
    const res = this.lmOnce(xs, ys, ws, subInit, subModel, 200, 1e-10);
    const full = [...currentP];
    for(let i=0;i<freeIdxs.length;i++) full[freeIdxs[i]] = res.params[i];
    return { params: full, rss: res.rss };
  },
};

/* ============================================================
   §4  BOOTSTRAP — paramétrico, residual, percentil y BCa
   ============================================================ */

const Bootstrap = {
  hasReplicates(xs){
    const c = {};
    for(const x of xs) c[x] = (c[x]||0)+1;
    return Object.values(c).some(v => v > 1);
  },

  run(xs, ys, sigmas, ws, p, model, nSamples, rng, mode = 'auto'){
    const N = xs.length, D = p.length;
    const residuals = xs.map((x, i) => ys[i] - model.eval(p, x));
    const residVar = residuals.reduce((s,r) => s+r*r, 0) / Math.max(1, N-D);
    const sigmaGlobal = Math.sqrt(residVar);

    const hasRep = this.hasReplicates(xs);
    const useResidual = mode === 'residual' || (mode === 'auto' && hasRep);

    let residPool = null;
    if(useResidual){
      residPool = residuals.slice();
      const mr = Stats.mean(residPool);
      residPool = residPool.map(r => r - mr);
    }

    const samples = [];
    for(let s=0; s<nSamples; s++){
      const ysStar = xs.map((x, i) => {
        const yHat = model.eval(p, x);
        if(useResidual){
          return clamp01(yHat + residPool[Math.floor(rng()*residPool.length)]);
        }
        const sI = (sigmas && sigmas[i] != null && sigmas[i] > 0) ? sigmas[i] : sigmaGlobal;
        return clamp01(yHat + gaussian(rng) * sI);
      });
      const r = Fitter.lmOnce(xs, ysStar, ws, p, model, 80, 1e-8);
      samples.push(r.params);
    }

    const idxs = model.primaryParams;
    const primary = idxs.map(i => samples.map(s => s[i]));
    return { all: samples, primary, sigmaGlobal, mode: useResidual ? 'residual' : 'parametric' };
  },

  /**
   * Jackknife completo: N refits dejando fuera cada punto.
   * Solo se usa cuando N es pequeño (≤ 40). Con N mayor, el coste
   * (N refits con multi-start) supera el beneficio sobre el percentil.
   */
  jackknife(xs, ys, ws, p, model){
    const out = [];
    const idxs = model.primaryParams;
    const N = xs.length;
    for(let leave=0; leave<N; leave++){
      const xsJ = [], ysJ = [], wsJ = ws ? [] : null;
      for(let i=0; i<N; i++){
        if(i === leave) continue;
        xsJ.push(xs[i]); ysJ.push(ys[i]);
        if(wsJ) wsJ.push(ws[i]);
      }
      const r = Fitter.lmOnce(xsJ, ysJ, wsJ, p, model, 80, 1e-8);
      out.push(idxs.map(i => r.params[i]));
    }
    return idxs.map((_, k) => out.map(sample => sample[k]));
  },

  /**
   * Intervalo de confianza BCa (Efron & Tibshirani 1993, cap. 14).
   * Corrige por sesgo (z0) y aceleración (a). Requiere los valores
   * del jackknife para la aceleración.
   */
  bcaCI(cloud, original, jackknifeValues, alpha = 0.05){
    const sorted = [...cloud].sort((a,b) => a-b);
    const B = sorted.length;

    // z0: fracción de muestras bootstrap por debajo del estimador original.
    // Clampeamos a [1/B, (B-1)/B] para evitar ±Infinity en gaussianInv.
    const below = cloud.filter(v => v < original).length;
    const prop = Math.max(1, Math.min(B-1, below)) / B;
    const z0 = gaussianInv(prop);

    // a: aceleración vía jackknife.
    let a = 0;
    if(jackknifeValues && jackknifeValues.length > 1){
      const jmean = Stats.mean(jackknifeValues);
      let num = 0, den = 0;
      for(const v of jackknifeValues){
        const d = jmean - v;
        num += d*d*d;
        den += d*d;
      }
      if(den > 1e-14){
        a = num / (6 * Math.pow(den, 1.5));
      }
    }

    const zLower = gaussianInv(alpha/2);
    const zUpper = gaussianInv(1 - alpha/2);
    const a1 = normCdf(z0 + (z0 + zLower) / (1 - a*(z0 + zLower)));
    const a2 = normCdf(z0 + (z0 + zUpper) / (1 - a*(z0 + zUpper)));

    const iLo = Math.max(0, Math.min(B-1, Math.floor(a1 * B)));
    const iHi = Math.max(0, Math.min(B-1, Math.floor(a2 * B)));
    return [sorted[iLo], sorted[iHi]];
  },
};

/** Inversa de la CDF normal estándar (Acklam 2004, precisión ~1e-9). */
function gaussianInv(p){
  const a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02,
             1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
  const b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02,
             6.680131188771972e+01, -1.328068155288572e+01];
  const c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00,
             -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
  const d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00,
             3.754408661907416e+00];
  const pLow = 0.02425, pHigh = 1 - pLow;
  if(p <= 0) return -Infinity;
  if(p >= 1) return Infinity;
  if(p < pLow){
    const q = Math.sqrt(-2*Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
           ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  } else if(p <= pHigh){
    const q = p - 0.5, r = q*q;
    return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q /
           (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
  } else {
    const q = Math.sqrt(-2*Math.log(1-p));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
            ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }
}

function normCdf(z){ return 0.5 * (1 + erf(z / Math.SQRT2)); }
function erf(x){
  const s = x < 0 ? -1 : 1;
  x = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - (((((1.061405429*t - 1.453152027)*t) + 1.421413741)*t - 0.284496736)*t + 0.254829592)*t * Math.exp(-x*x);
  return s * y;
}

/* ============================================================
   §5  MODELOS
   ============================================================ */

const MODELS = {
  hill2: {
    id:'hill2', name:'Hill 2p · y = x^α / (K^α + x^α)',
    paramNames:['log K','α'], primaryParams:[0,1],
    note:'Saturación clásica. K = concentración de semi-efecto.',
    eval(p, x){
      if (x<=0) return 0;
      const lx = Math.log(x);
      const xn = Math.exp(p[1] * lx);
      const Kn = Math.exp(p[1] * p[0]);
      return xn / (xn + Kn);
    },
    jacobian(p, x){
      if (x<=0) return [0, 0];
      const lx = Math.log(x);
      const xn = Math.exp(p[1] * lx);
      const Kn = Math.exp(p[1] * p[0]);
      const den = xn + Kn, d2 = den*den;
      return [-xn*p[1]*Kn/d2, xn*(lx*den - p[0]*Kn)/d2];
    },
    starts(xs, ys){
      const out = [];
      const lx = xs.map(Math.log10);
      const xMin = Math.min(...lx), xMax = Math.max(...lx);
      for(let i=0;i<11;i++){
        const lk10 = xMin - 1 + (xMax - xMin + 2) * i / 10;
        for(const a of [0.5,0.8,1.0,1.3,1.7,2.2,3.0,4.0]){
          out.push([lk10*Math.LN10, a]);
        }
      }
      return out;
    },
  },
  hill4: {
    id:'hill4', name:'Hill 4p · ymin + (ymax−ymin)·x^α/(K^α+x^α)',
    paramNames:['ymin','ymax','log K','α'], primaryParams:[2,3],
    note:'Hill con asíntotas ajustables.',
    eval(p, x){
      if (x<=0) return p[0];
      const lx = Math.log(x);
      const xn = Math.exp(p[3] * lx);
      const Kn = Math.exp(p[3] * p[2]);
      return p[0] + (p[1]-p[0]) * xn / (xn + Kn);
    },
    jacobian(p, x){
      if (x<=0) return [1, 0, 0, 0];
      const lx = Math.log(x);
      const xn = Math.exp(p[3] * lx);
      const Kn = Math.exp(p[3] * p[2]);
      const den = xn + Kn, d2 = den*den;
      const f = xn / den;
      const dfdlogK = -xn * p[3] * Kn / d2;
      const dfdalpha = xn * (lx * den - p[2] * Kn) / d2;
      return [1-f, f, (p[1]-p[0])*dfdlogK, (p[1]-p[0])*dfdalpha];
    },
    starts(xs, ys){
      const out = [];
      const yMinData = Math.max(0, Math.min(...ys) - 0.05);
      const yMaxData = Math.min(1, Math.max(...ys) + 0.05);
      const lx = xs.map(Math.log10);
      const xMin = Math.min(...lx), xMax = Math.max(...lx);
      for(const ymin of [yMinData, Math.max(0, yMinData - 0.1)]){
        for(const ymax of [yMaxData, Math.min(1, yMaxData + 0.1)]){
          for(let i=0;i<7;i++){
            const lk10 = xMin - 0.5 + (xMax - xMin + 1) * i / 6;
            for(const a of [0.8, 1.2, 1.8]){
              out.push([ymin, ymax, lk10*Math.LN10, a]);
            }
          }
        }
      }
      return out;
    },
  },
  expSat: {
    id:'expSat', name:'Sat. exponencial · ymax·(1 − e^(−x/τ))',
    paramNames:['ymax','log τ'], primaryParams:[0,1],
    note:'Saturación de primer orden.',
    eval(p, x){
      if (x<=0) return 0;
      return p[0] * (1 - Math.exp(-x / Math.exp(p[1])));
    },
    jacobian(p, x){
      if (x<=0) return [0, 0];
      const tau = Math.exp(p[1]);
      const e = Math.exp(-x/tau);
      return [1-e, -p[0]*e*x/tau];
    },
    starts(xs, ys){
      const out = [];
      const ymax0 = Math.min(1, Math.max(...ys) * 1.05);
      const lx = xs.map(Math.log);
      const lxMin = Math.min(...lx), lxMax = Math.max(...lx);
      for(let i=0;i<10;i++){
        const lt = lxMin - 0.5 + (lxMax - lxMin + 1) * i / 9;
        out.push([ymax0, lt]);
      }
      return out;
    },
  },
  gompertz: {
    id:'gompertz', name:'Gompertz · ymax·e^(−e^(−(x−μ)/β))',
    paramNames:['ymax','log μ','log β'], primaryParams:[1,2],
    note:'S-curva asimétrica.',
    eval(p, x){
      if (x<=0) return 0;
      const mu = Math.exp(p[1]);
      const beta = Math.exp(p[2]);
      return p[0] * Math.exp(-Math.exp(-(x-mu)/beta));
    },
    jacobian(p, x){
      if (x<=0) return [0, 0, 0];
      const mu = Math.exp(p[1]);
      const beta = Math.exp(p[2]);
      const z = Math.exp(-(x-mu)/beta);
      const f = Math.exp(-z);
      const y = p[0] * f;
      return [f, -y*z*mu/beta, -y*z*(x-mu)/beta];
    },
    starts(xs, ys){
      const out = [];
      const ymax0 = Math.min(1, Math.max(...ys) * 1.05);
      const lx = xs.map(Math.log);
      const lxMin = Math.min(...lx), lxMax = Math.max(...lx);
      const span = lxMax - lxMin;
      for(let i=0;i<7;i++){
        const lmu = lxMin + span * (0.25 + 0.5*i/6);
        for(const lb of [Math.log(span*0.1), Math.log(span*0.25), Math.log(span*0.6)]){
          out.push([ymax0, lmu, lb]);
        }
      }
      return out;
    },
  },
};

/* ============================================================
   §6  CRYPTO
   ============================================================ */

const Crypto = {
  async sha256(str){
    const buf = new TextEncoder().encode(str);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash))
      .map(b => b.toString(16).padStart(2, '0')).join('');
  },
  async hashObject(obj){
    const canonical = JSON.stringify(obj, (_, v) => {
      if (v && typeof v === 'object' && !Array.isArray(v)){
        return Object.keys(v).sort().reduce((acc,k) => (acc[k]=v[k], acc), {});
      }
      return v;
    });
    return this.sha256(canonical);
  },
};

/* ============================================================
   §7  WORKER
   ============================================================
   Serialización: las funciones se reconstruyen con new Function.
   Esto requiere 'unsafe-inline' en la CSP, que está declarada
   arriba. En producción se movería el core a un módulo ES
   separado y se importaría con importScripts.
   ============================================================ */

function buildWorkerSource(){
  return `
    'use strict';
    ${createPrng.toString()}
    ${gaussian.toString()}
    ${clamp01.toString()}
    ${solveLinear.toString()}
    ${solveQR.toString()}
    ${Stats.mean.toString()}
    ${Stats.stdev.toString()}
    ${Stats.percentile.toString()}
    ${Stats.corr.toString()}
    const Stats = { mean, stdev, percentile, corr };
    ${Fitter.rss.toString()}
    ${Fitter.lmOnce.toString()}
    ${Fitter.fit.toString()}
    ${Fitter.optimizeHeld.toString()}
    const Fitter = { rss, lmOnce, fit, optimizeHeld };
    ${Bootstrap.hasReplicates.toString()}
    ${Bootstrap.run.toString()}
    const Bootstrap = { hasReplicates, run };
    let MODELS = {};
    self.onmessage = function(e){
      const { id, type, payload } = e.data;
      try {
        let result;
        if(type === 'registerModels'){
          MODELS = {};
          for(const [mid, mdef] of Object.entries(payload)){
            MODELS[mid] = {
              id: mdef.id,
              paramNames: mdef.paramNames,
              primaryParams: mdef.primaryParams,
              eval: new Function('p','x', mdef.evalSrc),
              jacobian: new Function('p','x', mdef.jacobianSrc),
              starts: new Function('xs','ys', mdef.startsSrc),
            };
          }
          result = { registered: Object.keys(MODELS).length };
        }
        else if(type === 'fit'){
          const { xs, ys, ws, modelId } = payload;
          result = Fitter.fit(xs, ys, ws, MODELS[modelId]);
        }
        else if(type === 'bootstrap'){
          const { xs, ys, sigmas, ws, params, modelId, nSamples, seed, mode } = payload;
          const rng = createPrng(seed);
          result = Bootstrap.run(xs, ys, sigmas, ws, params, MODELS[modelId], nSamples, rng, mode);
        }
        else {
          throw new Error('Unknown message type: ' + type);
        }
        self.postMessage({ id, ok: true, result });
      } catch(err){
        self.postMessage({ id, ok: false, error: String(err && err.message || err) });
      }
    };
  `;
}

class ComputeClient {
  constructor(){
    const src = buildWorkerSource();
    const blob = new Blob([src], { type: 'application/javascript' });
    this.blobUrl = URL.createObjectURL(blob);
    this.worker = new Worker(this.blobUrl);
    this.pending = new Map();
    this.nextId = 1;
    this.worker.onmessage = (e) => {
      const { id, ok, result, error } = e.data;
      const entry = this.pending.get(id);
      if(!entry) return;
      this.pending.delete(id);
      if(ok) entry.resolve(result);
      else entry.reject(new Error(error));
    };
    this.worker.onerror = (e) => {
      console.error('[worker error]', e);
      for(const [, entry] of this.pending){
        entry.reject(new Error('Worker crashed: ' + e.message));
      }
      this.pending.clear();
    };
  }

  registerModels(){
    const payload = {};
    for(const [id, m] of Object.entries(MODELS)){
      payload[id] = {
        id: m.id,
        paramNames: m.paramNames,
        primaryParams: m.primaryParams,
        evalSrc: m.eval.toString(),
        jacobianSrc: m.jacobian.toString(),
        startsSrc: m.starts.toString(),
      };
    }
    return this.call('registerModels', payload);
  }

  call(type, payload){
    const id = this.nextId++;
    return new Promise((resolve, reject) => {
      this.pending.set(id, { resolve, reject });
      this.worker.postMessage({ id, type, payload });
    });
  }

  /**
   * Cierra el worker y revoca el Blob URL. Sin esto, el worker y su
   * blob quedan vivos hasta que el documento se descarga. Con navegación
   * SPA o reinit, se acumulan.
   */
  terminate(){
    try { this.worker.terminate(); } catch(_) {}
    try { URL.revokeObjectURL(this.blobUrl); } catch(_) {}
    for(const [, entry] of this.pending){
      entry.reject(new Error('Client terminated'));
    }
    this.pending.clear();
  }
}

/* ============================================================
   §8  STORAGE
   ============================================================ */

const Storage = {
  DB_NAME: 'cascabel',
  STORE: 'state',
  async open(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if(!db.objectStoreNames.contains(this.STORE)){
          db.createObjectStore(this.STORE);
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async save(key, value){
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(this.STORE, 'readwrite');
      tx.objectStore(this.STORE).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  },
  async load(key){
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(this.STORE, 'readonly');
      const req = tx.objectStore(this.STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async delete(key){
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(this.STORE, 'readwrite');
      tx.objectStore(this.STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  },
};

class CascabelPanel extends HTMLElement {
  connectedCallback(){
    if(this._initialized) return;
    this._initialized = true;
    const title = this.getAttribute('data-title') || '';
    const downloadKey = this.getAttribute('data-download');

    const header = document.createElement('header');
    const span = document.createElement('span');
    span.textContent = title;
    header.appendChild(span);

    if(downloadKey){
      const btn = document.createElement('button');
      btn.className = 'dl';
      btn.textContent = 'SVG';
      btn.setAttribute('aria-label', `Descargar ${title} como SVG`);
      btn.onclick = () => {
        const svg = this.querySelector('svg');
        if(!svg) return;
        const xml = new XMLSerializer().serializeToString(svg);
        downloadFile(`${downloadKey}.svg`, `<?xml version="1.0"?>${xml}`, 'image/svg+xml');
      };
      header.appendChild(btn);
    }

    const body = document.createElement('div');
    body.className = 'body';
    while(this.firstChild) body.appendChild(this.firstChild);

    this.appendChild(header);
    this.appendChild(body);
  }
}

class CascabelToast extends HTMLElement {
  show(msg, ms = 2000){
    this.textContent = msg;
    this.classList.add('show');
    clearTimeout(this._t);
    this._t = setTimeout(() => this.classList.remove('show'), ms);
  }
}

const SVG = {
  ns:'http://www.w3.org/2000/svg',
  W: 600, H: 340,
  PAD: { l:60, r:30, t:20, b:50 },

  el(tag, attrs = {}, children = []){
    const e = document.createElementNS(this.ns, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    for(const c of children){
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return e;
  },

  frame(container){
    container.innerHTML = '';
    const s = this.el('svg', {
      viewBox:`0 0 ${this.W} ${this.H}`,
      width:'100%',
      role: 'img',
      'aria-label': 'Gráfico'
    });
    container.appendChild(s);
    return s;
  },

  axes(svg, xDom, yDom, xLab, yLab, opts = {}){
    const { l, r, t, b } = this.PAD;
    const pw = this.W - l - r, ph = this.H - t - b;
    const [x0, x1] = xDom, [y0, y1] = yDom;
    const X = v => l + ((v - x0) / (x1 - x0)) * pw;
    const Y = v => t + ph - ((v - y0) / (y1 - y0)) * ph;
    const fontSize = opts.fontSize || 10;
    for(let i=0; i<=5; i++){
      const xv = x0 + (x1-x0)*i/5;
      const yv = y0 + (y1-y0)*i/5;
      svg.appendChild(this.el('line', { x1:X(xv), y1:t, x2:X(xv), y2:t+ph, stroke:'#26262e' }));
      svg.appendChild(this.el('line', { x1:l, y1:Y(yv), x2:l+pw, y2:Y(yv), stroke:'#26262e' }));
      svg.appendChild(this.el('text', {
        x:X(xv), y:t+ph+18, 'text-anchor':'middle',
        fill:'#8a8a93', 'font-size':fontSize, 'font-family':'ui-monospace'
      }, [opts.xFmt ? opts.xFmt(xv) : xv.toFixed(2)]));
      svg.appendChild(this.el('text', {
        x:l-8, y:Y(yv)+3, 'text-anchor':'end',
        fill:'#8a8a93', 'font-size':fontSize, 'font-family':'ui-monospace'
      }, [opts.yFmt ? opts.yFmt(yv) : yv.toFixed(2)]));
    }
    svg.appendChild(this.el('text', {
      x:l+pw/2, y:this.H-8, 'text-anchor':'middle',
      fill:'#8a8a93', 'font-size':11
    }, [xLab]));
    svg.appendChild(this.el('text', {
      x:14, y:t+ph/2, 'text-anchor':'middle',
      fill:'#8a8a93', 'font-size':11,
      transform:`rotate(-90 14 ${t+ph/2})`
    }, [yLab]));
    svg.appendChild(this.el('line', { x1:l, y1:t, x2:l, y2:t+ph, stroke:'#8a8a93' }));
    svg.appendChild(this.el('line', { x1:l, y1:t+ph, x2:l+pw, y2:t+ph, stroke:'#8a8a93' }));
    return { X, Y, pw, ph, l, t };
  },

  fit(container, xs, ys, sigmas, p, model){
    const svg = this.frame(container);
    svg.setAttribute('aria-label', 'Ajuste del modelo a los datos');
    const lx = xs.map(Math.log10);
    const xMin = Math.min(...lx)-0.3, xMax = Math.max(...lx)+0.3;
    const ax = this.axes(svg, [xMin, xMax], [-0.02, 1.02], 'log₁₀ x', 'y');
    const pts = [];
    for(let i=0; i<=200; i++){
      const lgx = xMin + (xMax-xMin)*i/200;
      const x = Math.pow(10, lgx);
      const y = model.eval(p, x);
      pts.push(`${ax.X(lgx).toFixed(2)},${ax.Y(y).toFixed(2)}`);
    }
    svg.appendChild(this.el('polyline', {
      points:pts.join(' '), fill:'none', stroke:'#f5a623', 'stroke-width':2
    }));
    for(let i=0; i<xs.length; i++){
      const cx = ax.X(Math.log10(xs[i])), cy = ax.Y(ys[i]);
      if(sigmas && sigmas[i] != null && sigmas[i] > 0){
        const dy = sigmas[i] * (this.H - this.PAD.t - this.PAD.b) / 1.04;
        svg.appendChild(this.el('line', {
          x1:cx, y1:cy-dy, x2:cx, y2:cy+dy, stroke:'#8a8a93', 'stroke-width':1
        }));
      }
      svg.appendChild(this.el('circle', {
        cx, cy, r:3.5, fill:'#e5e5e7', stroke:'#0a0a0b', 'stroke-width':1
      }));
    }
  },

  ellipse(container, datasets, labA, labB){
    const svg = this.frame(container);
    svg.setAttribute('aria-label', 'Elipse de confianza bootstrap');
    let allA = [], allB = [];
    for(const d of datasets){ allA = allA.concat(d.cloudA); allB = allB.concat(d.cloudB); }
    if(!allA.length) return;
    const minA = Math.min(...allA), maxA = Math.max(...allA);
    const minB = Math.min(...allB), maxB = Math.max(...allB);
    const padA = (maxA-minA)*0.15 || 0.1, padB = (maxB-minB)*0.15 || 0.1;
    const ax = this.axes(svg, [minA-padA, maxA+padA], [minB-padB, maxB+padB], labA, labB);
    const sx = (ax.X(maxA+padA) - ax.X(minA-padA)) / ((maxA+padA)-(minA-padA));
    const sy = (ax.Y(minB-padB) - ax.Y(maxB+padB)) / ((maxB+padB)-(minB-padB));
    for(const d of datasets){
      for(let i=0; i<d.cloudA.length; i++){
        svg.appendChild(this.el('circle', {
          cx: ax.X(d.cloudA[i]), cy: ax.Y(d.cloudB[i]),
          r: 1.5, fill: d.color, opacity: 0.3
        }));
      }
      const mA = Stats.mean(d.cloudA), mB = Stats.mean(d.cloudB);
      const sA = Stats.stdev(d.cloudA), sB = Stats.stdev(d.cloudB);
      const r = Stats.corr(d.cloudA, d.cloudB);
      const chi2 = 5.99;
      const a = Math.sqrt(chi2 * (sA*sA + sB*sB + Math.sqrt((sA*sA-sB*sB)**2 + 4*(r*sA*sB)**2)) / 2);
      const b = Math.sqrt(chi2 * (sA*sA + sB*sB - Math.sqrt((sA*sA-sB*sB)**2 + 4*(r*sA*sB)**2)) / 2);
      const angle = 0.5 * Math.atan2(2*r*sA*sB, sA*sA - sB*sB);
      const cx = ax.X(mA), cy = ax.Y(mB);
      const rx = a*sx, ry = b*sy;
      const deg = -angle * 180 / Math.PI;
      svg.appendChild(this.el('ellipse', {
        cx, cy, rx, ry,
        transform: `rotate(${deg} ${cx} ${cy})`,
        fill:'none', stroke:d.color, 'stroke-width':1.5, 'stroke-dasharray':'4 3'
      }));
      svg.appendChild(this.el('circle', {
        cx: ax.X(d.pA), cy: ax.Y(d.pB), r:4,
        fill:d.color, stroke:'#0a0a0b', 'stroke-width':1.5
      }));
    }
  },

  profile(container, prof, label){
    const svg = this.frame(container);
    svg.setAttribute('aria-label', `Perfil likelihood de ${label}`);
    const { values, dRSS, threshold, ciLo, ciHi } = prof;
    const minV = Math.min(...values), maxV = Math.max(...values);
    const finite = dRSS.filter(v => isFinite(v));
    const maxD = Math.min(Math.max(...finite, threshold), threshold*4);
    const ax = this.axes(svg, [minV, maxV], [0, maxD], label, 'Δ RSS');
    const yTh = ax.Y(threshold);
    svg.appendChild(this.el('line', {
      x1:ax.l, y1:yTh, x2:ax.l+ax.pw, y2:yTh,
      stroke:'#e5484d', 'stroke-dasharray':'4 3'
    }));
    let current = [], segs = [];
    for(let i=0; i<values.length; i++){
      if(!isFinite(dRSS[i]) || dRSS[i] > maxD*1.5){
        if(current.length > 1) segs.push(current);
        current = []; continue;
      }
      current.push(`${ax.X(values[i]).toFixed(2)},${ax.Y(Math.min(dRSS[i],maxD)).toFixed(2)}`);
    }
    if(current.length > 1) segs.push(current);
    for(const s of segs){
      svg.appendChild(this.el('polyline', {
        points:s.join(' '), fill:'none', stroke:'#f5a623', 'stroke-width':2
      }));
    }
    if(ciLo != null && ciHi != null){
      svg.appendChild(this.el('rect', {
        x: ax.X(ciLo), y: ax.t,
        width: ax.X(ciHi)-ax.X(ciLo), height: ax.ph,
        fill:'rgba(245,166,35,0.08)'
      }));
    }
  },

  extrapolation(container, augment, replace){
    const svg = this.frame(container);
    svg.setAttribute('aria-label', 'Curva de extrapolación');
    if(!augment) return;
    const maxD = Math.max(...augment.map(x => x.d));
    const ax = this.axes(svg, [0, maxD], [0, 1.0], 'décadas añadidas', '|r(p1,p2)|');
    const y09 = ax.Y(0.9);
    svg.appendChild(this.el('line', {
      x1:ax.l, y1:y09, x2:ax.l+ax.pw, y2:y09,
      stroke:'#30a46c', 'stroke-dasharray':'4 3'
    }));
    svg.appendChild(this.el('polyline', {
      points: augment.map(x => `${ax.X(x.d).toFixed(2)},${ax.Y(x.r).toFixed(2)}`).join(' '),
      fill:'none', stroke:'#f5a623', 'stroke-width':2
    }));
    if(replace){
      svg.appendChild(this.el('polyline', {
        points: replace.map(x => `${ax.X(x.d).toFixed(2)},${ax.Y(x.r).toFixed(2)}`).join(' '),
        fill:'none', stroke:'#8a8a93', 'stroke-width':1.5, 'stroke-dasharray':'5 3'
      }));
    }
  },
};

/* ============================================================
   §11  ESTADO + PARSERS
   ============================================================ */

const DATASET_COLORS = { A:'#f5a623', B:'#7cb8ff', C:'#a8f5a6', D:'#f5a6d9' };

const State = {
  model: 'hill2',
  datasets: [],
  profile: { k: null, a: null, idxK: null, idxA: null },
  diagnostics: null,
  extrapolation: null,
  manifest: null,
  seed: 42,
};

function active(){ return State.datasets[0] || null; }

/** Encuentra el primer # no precedido por \. */
function findUnescapedHash(str){
  for(let i=0; i<str.length; i++){
    if(str[i] === '#' && str[i-1] !== '\\') return i;
  }
  return -1;
}

function parseDataText(text){
  const points = [], errors = [];
  const lines = text.split('\n');
  for(let i=0; i<lines.length; i++){
    const raw = lines[i];
    // Comentarios inline: "# ..." al final de línea se descarta.
    // Escapar con "\#" si se necesita un # literal.
    const hashIdx = findUnescapedHash(raw);
    const line = (hashIdx >= 0 ? raw.slice(0, hashIdx) : raw).trim();
    if(!line) continue;
    const parts = line.split(/[,\s\t]+/).filter(Boolean);
    if(parts.length < 2){ errors.push(`L${i+1}: faltan columnas`); continue; }
    const x = parseFloat(parts[0]), y = parseFloat(parts[1]);
    const sigma = parts[2] != null ? parseFloat(parts[2]) : null;
    const n = parts[3] != null ? parseInt(parts[3], 10) : 1;
    if(!isFinite(x) || x <= 0){ errors.push(`L${i+1}: x debe ser > 0`); continue; }
    if(!isFinite(y) || y < 0 || y > 1){ errors.push(`L${i+1}: y debe estar en [0,1]`); continue; }
    if(sigma != null && (!isFinite(sigma) || sigma <= 0)){ errors.push(`L${i+1}: σ debe ser > 0`); continue; }
    points.push({ x, y, sigma, n });
  }
  return { points, errors };
}

function pointsToArrays(points){
  const xs = [], ys = [], sigmas = [], ws = [];
  let hasSigma = false;
  for(const p of points){
    xs.push(p.x); ys.push(p.y);
    if(p.sigma != null && p.sigma > 0){
      sigmas.push(p.sigma); ws.push(1/(p.sigma*p.sigma)); hasSigma = true;
    } else { sigmas.push(null); ws.push(null); }
  }
  return { xs, ys, sigmas, ws: hasSigma ? ws : null };
}

function pointsToText(points){
  return points.map(p => {
    const parts = [p.x.toPrecision(4), p.y.toFixed(4)];
    if(p.sigma != null) parts.push(p.sigma.toFixed(4));
    return parts.join(', ');
  }).join('\n');
}

/* ============================================================
   §12  PIPELINE
   ============================================================ */

function chooseBootstrapN(N){
  if(N <= 20) return 400;
  if(N <= 50) return 300;
  if(N <= 100) return 200;
  return 120;
}
function clampSpan(s, min, max){ return Math.max(min, Math.min(max, s)); }
function microtask(){ return new Promise(r => queueMicrotask(r)); }

async function fitAll(compute){
  const text = document.getElementById('dataInput').value;
  const { points, errors } = parseDataText(text);
  if(errors.length) toast(`⚠ ${errors.length} línea(s) ignoradas`);
  if(points.length < 4){ toast('Necesitas al menos 4 puntos'); return; }

  State.datasets[0] = {
    id:'A', points, fit:null, bootstrap:null, jackknife:null,
    color:DATASET_COLORS.A,
  };

  const { xs, ys, sigmas, ws } = pointsToArrays(points);

  setProgress('Ajustando…');
  await microtask();

  let fit;
  try {
    fit = await compute.call('fit', { xs, ys, ws, modelId: State.model });
  } catch(e){
    setProgress('');
    toast('Error en ajuste: ' + e.message);
    console.error(e);
    return;
  }

  setProgress('Bootstrap…');
  await microtask();

  const nB = chooseBootstrapN(xs.length);
  let boot;
  try {
    boot = await compute.call('bootstrap', {
      xs, ys, sigmas, ws, params: fit.params, modelId: State.model,
      nSamples: nB, seed: State.seed, mode: 'auto'
    });
  } catch(e){
    setProgress('');
    toast('Error en bootstrap: ' + e.message);
    console.error(e);
    return;
  }

  State.datasets[0].fit = fit;
  State.datasets[0].bootstrap = boot;

  // Jackknife para BCa solo si N es pequeño. Con N grande el coste
  // (N refits con multi-start) no se justifica frente al percentil.
  const model = MODELS[State.model];
  if(xs.length <= 40){
    setProgress('Jackknife para BCa…');
    await microtask();
    try {
      State.datasets[0].jackknife = Bootstrap.jackknife(xs, ys, ws, fit.params, model);
    } catch(e){
      console.warn('[jackknife] falló:', e);
      State.datasets[0].jackknife = null;
    }
  } else {
    State.datasets[0].jackknife = null;
  }

  setProgress('Perfiles…');
  await microtask();

  const range = Diagnostics.rangeCoverage(xs);
  const r = model.primaryParams.length >= 2
    ? Stats.corr(boot.primary[0], boot.primary[1]) : 0;
  const kappa = Diagnostics.conditionNumber(xs, fit.params, ws, model);
  State.diagnostics = { range, r, kappa, verdict: Diagnostics.verdict(range, r, kappa) };

  if(model.primaryParams.length === 2){
    const [iA, iB] = model.primaryParams;
    const stdA = Stats.stdev(boot.primary[0]), stdB = Stats.stdev(boot.primary[1]);
    const spanA = clampSpan(stdA*4, 0.5, 20);
    const spanB = clampSpan(stdB*4, 0.3, 5);
    State.profile.k = profileLikelihood(xs, ys, ws, fit.params, model, iA, spanA, 30);
    State.profile.a = profileLikelihood(xs, ys, ws, fit.params, model, iB, spanB, 30);
    State.profile.idxK = iA; State.profile.idxA = iB;
  } else {
    State.profile = { k:null, a:null, idxK:null, idxA:null };
  }

  // Manifest reproducible: run_id sin timestamp dentro del hash.
  State.manifest = null;
  try {
    if(crypto.subtle){
      const datasetHash = await Crypto.hashObject(points);
      const configHash = await Crypto.hashObject({ nB, mode:'auto', version:'1.0' });
      const runId = await Crypto.hashObject({
        seed: State.seed,
        modelId: State.model,
        datasetHash,
        configHash,
      });
      State.manifest = {
        runId,
        timestamp: new Date().toISOString(),
        seed: State.seed,
        modelId: State.model,
        datasetHash,
        configHash,
      };
    }
  } catch(e){
    console.warn('[manifest] no disponible:', e);
  }

  State.extrapolation = null;
  const extrap = document.getElementById('extrapPanel');
  if(extrap) extrap.hidden = true;

  setProgress('');
  render();
  renderManifest();
  document.getElementById('extrapolateBtn').disabled = false;
}

async function extrapolate(){
  const d = active();
  if(!d || !d.fit) return;
  const model = MODELS[State.model];
  if(model.primaryParams.length !== 2){ toast('El modelo no tiene 2 params primarios'); return; }
  setProgress('Calculando extrapolación…');
  await microtask();

  const { xs, ys } = pointsToArrays(d.points);
  const rng = createPrng(State.seed + 101);
  const augment = extrapolationCurve(xs, ys, d.fit.params, model, rng, 'augment');
  const replace = extrapolationCurve(xs, ys, d.fit.params, model, rng, 'replace');

  State.extrapolation = { augment, replace };
  const extrap = document.getElementById('extrapPanel');
  extrap.hidden = false;
  SVG.extrapolation(document.getElementById('extrapPlot'), augment, replace);

  const firstGood = augment.find(x => x.r < 0.9);
  document.getElementById('extrapNote').innerHTML = firstGood
    ? `Añadir <strong>${firstGood.d.toFixed(2)} décadas</strong> reduce |r| por debajo de 0.9.`
    : `Ni con 3 décadas extra baja de 0.9.`;

  setProgress('');
}

function extrapolationCurve(xs, ys, p, model, rng, mode = 'augment'){
  if(model.primaryParams.length !== 2) return null;
  const lx = xs.map(Math.log10);
  const xMin = Math.min(...lx), xMax = Math.max(...lx);
  const deltas = [0, 0.25, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0];
  const resid = xs.map((x, i) => ys[i] - model.eval(p, x));
  const N = xs.length, D = p.length;
  const sigma = Math.sqrt(resid.reduce((s,r)=>s+r*r, 0) / Math.max(1, N-D));

  const results = [];
  for(const d of deltas){
    let evalXs, evalYs;
    if(mode === 'augment'){
      const nExt = d > 0 ? 8 : 0;
      const extXs = [], extYs = [];
      for(let i=0; i<nExt; i++){
        const lgx = (xMin - d) + d * i / (nExt - 1 + 1e-9);
        const x = Math.pow(10, lgx);
        extXs.push(x); extYs.push(clamp01(model.eval(p, x) + gaussian(rng)*sigma));
      }
      for(let i=0; i<nExt; i++){
        const lgx = xMax + d * i / (nExt - 1 + 1e-9);
        const x = Math.pow(10, lgx);
        extXs.push(x); extYs.push(clamp01(model.eval(p, x) + gaussian(rng)*sigma));
      }
      evalXs = [...xs, ...extXs]; evalYs = [...ys, ...extYs];
    } else {
      const n = 20;
      evalXs = []; evalYs = [];
      for(let i=0; i<n; i++){
        const lgx = (xMin - d) + (xMax + d - (xMin - d)) * i / (n-1);
        const x = Math.pow(10, lgx);
        evalXs.push(x); evalYs.push(clamp01(model.eval(p, x) + gaussian(rng)*sigma));
      }
    }
    const fit = Fitter.fit(evalXs, evalYs, null, model);
    const nShort = Math.max(60, Math.min(120, 2000 / Math.max(10, evalXs.length)));
    const boot = Bootstrap.run(evalXs, evalYs, null, null, fit.params, model, nShort, rng, 'parametric');
    const r = Stats.corr(boot.primary[0], boot.primary[1]);
    results.push({ d, r: Math.abs(r), fit: fit.params, nPoints: evalXs.length });
  }
  return results;
}

/* ============================================================
   §13  DIAGNÓSTICOS + PROFILE
   ============================================================ */

const Diagnostics = {
  rangeCoverage(xs){
    const lx = xs.map(Math.log10);
    const lo = Math.min(...lx), hi = Math.max(...lx);
    return { decades: hi - lo, lo, hi, center: (hi + lo) / 2 };
  },
  conditionNumber(xs, p, ws, model){
    const N = xs.length, D = p.length;
    const H = Array.from({length: D}, () => new Array(D).fill(0));
    for(let i=0; i<N; i++){
      const J = model.jacobian(p, xs[i]);
      const w = (ws && ws[i] != null) ? ws[i] : 1;
      for(let a=0; a<D; a++){
        for(let b=0; b<D; b++) H[a][b] += w * J[a] * J[b];
      }
    }
    const idxs = model.primaryParams;
    if(idxs.length === 2){
      const h00 = H[idxs[0]][idxs[0]];
      const h11 = H[idxs[1]][idxs[1]];
      const h01 = H[idxs[0]][idxs[1]];
      const tr = h00 + h11, det = h00*h11 - h01*h01;
      const disc = Math.sqrt(Math.max(0, tr*tr - 4*det));
      const l1 = (tr+disc)/2, l2 = (tr-disc)/2;
      if(l2 <= 1e-12) return Infinity;
      return l1/l2;
    }
    return NaN;
  },
  verdict(range, r, kappa){
    const absR = Math.abs(r);
    if(range.decades < 1.0 || absR > 0.995 || kappa > 1e6){
      return { level:'danger', label:'Degeneración crítica',
        msg:'Los parámetros primarios no son separables con estos datos.' };
    }
    if(range.decades < 2.0 || absR > 0.98 || kappa > 1e4){
      return { level:'warn', label:'Degeneración significativa',
        msg:'Los CI individuales son varias veces más anchos que el CI del compuesto.' };
    }
    if(range.decades < 3.0 || absR > 0.9){
      return { level:'warn', label:'Degeneración moderada',
        msg:'Los parámetros son separables pero la correlación sigue siendo alta.' };
    }
    return { level:'ok', label:'Parámetros separables',
      msg:'El rango cubre el codo. Los parámetros primarios son identificables.' };
  },
};

function profileLikelihood(xs, ys, ws, p, model, whichIdx, span, nPts){
  const rssMin = Fitter.rss(xs, ys, p, ws, model);
  const N = xs.length, D = p.length;
  const sigmaSq = rssMin / Math.max(1, N - D);
  const Fcrit = N - D > 3 ? 3.84 : 4.5;
  const threshold = sigmaSq * Fcrit;
  const otherIdxs = [...Array(D).keys()].filter(i => i !== whichIdx);
  const center = p[whichIdx];
  const values = [], dRSS = [];

  for(let i=0; i<nPts; i++){
    const v = center - span + 2 * span * i / (nPts - 1);
    let valid = true;
    if(whichIdx === 1 && model.id === 'hill2' && v <= 0.05) valid = false;
    if(whichIdx === 3 && model.id === 'hill4' && v <= 0.05) valid = false;
    if(!valid){ values.push(v); dRSS.push(Infinity); continue; }
    const heldP = [...p]; heldP[whichIdx] = v;
    const res = Fitter.optimizeHeld(xs, ys, ws, model, heldP, otherIdxs);
    values.push(v); dRSS.push(res.rss - rssMin);
  }

  let ciLo = null, ciHi = null;
  for(let i=1; i<values.length; i++){
    if(dRSS[i-1] < threshold && dRSS[i] >= threshold){
      const t = (threshold - dRSS[i-1]) / (dRSS[i] - dRSS[i-1]);
      ciHi = values[i-1] + t * (values[i] - values[i-1]);
    }
    if(dRSS[i-1] >= threshold && dRSS[i] < threshold){
      const t = (threshold - dRSS[i]) / (dRSS[i-1] - dRSS[i]);
      ciLo = values[i] + t * (values[i-1] - values[i]);
    }
  }
  return { values, dRSS, threshold, ciLo, ciHi, rssMin };
}

/* ============================================================
   §14  RENDER
   ============================================================ */

const $ = id => document.getElementById(id);

function toast(msg, ms = 2000){
  const t = $('toast');
  if(t && t.show) t.show(msg, ms);
}

function setProgress(msg){
  $('progressNote').innerHTML = msg ? `<span class="spinner"></span>${msg}` : '';
}

function render(){
  const d = active();
  if(!d || !d.fit) return;
  const model = MODELS[State.model];
  const { xs, ys, sigmas } = pointsToArrays(d.points);
  const p = d.fit.params;

  SVG.fit($('fitPlot'), xs, ys, sigmas, p, model);
  renderParamTable();
  renderVerdict();
  renderDiagnostics();

  if(d.bootstrap && model.primaryParams.length === 2){
    const [iA, iB] = model.primaryParams;
    SVG.ellipse($('ellipsePlot'), [{
      cloudA: d.bootstrap.primary[0],
      cloudB: d.bootstrap.primary[1],
      pA: p[iA], pB: p[iB],
      color: DATASET_COLORS.A,
    }], model.paramNames[iA], model.paramNames[iB]);
  }

  if(State.profile.k){
    SVG.profile($('profileK'), State.profile.k, model.paramNames[State.profile.idxK] || 'p1');
  }
  if(State.profile.a){
    SVG.profile($('profileA'), State.profile.a, model.paramNames[State.profile.idxA] || 'p2');
  }
}

function renderParamTable(){
  const d = active();
  const model = MODELS[State.model];
  const p = d.fit.params, boot = d.bootstrap;
  let rows = '';
  let ciMethod = '—';

  if(boot && model.primaryParams.length === 2){
    const [iA, iB] = model.primaryParams;

    // BCa si hay jackknife (N ≤ 40). Percentil si no.
    let ciA, ciB;
    if(d.jackknife){
      ciA = Bootstrap.bcaCI(boot.primary[0], p[iA], d.jackknife[0], 0.05);
      ciB = Bootstrap.bcaCI(boot.primary[1], p[iB], d.jackknife[1], 0.05);
      ciMethod = 'BCa';
    } else {
      const sortedA = [...boot.primary[0]].sort((a,b)=>a-b);
      const sortedB = [...boot.primary[1]].sort((a,b)=>a-b);
      ciA = [Stats.percentile(sortedA, 0.025), Stats.percentile(sortedA, 0.975)];
      ciB = [Stats.percentile(sortedB, 0.025), Stats.percentile(sortedB, 0.975)];
      ciMethod = 'percentil';
    }

    rows += `<tr><td>${model.paramNames[iA]}</td><td class="num">${fmt(p[iA])}</td><td class="num">[${fmt(ciA[0])}, ${fmt(ciA[1])}]</td></tr>`;
    rows += `<tr><td>${model.paramNames[iB]}</td><td class="num">${fmt(p[iB])}</td><td class="num">[${fmt(ciB[0])}, ${fmt(ciB[1])}]</td></tr>`;
  } else {
    for(let i=0; i<p.length; i++){
      rows += `<tr><td>${model.paramNames[i]}</td><td class="num">${fmt(p[i])}</td><td class="num">—</td></tr>`;
    }
  }

  rows += `<tr><td>RSS</td><td class="num">${d.fit.rss.toExponential(3)}</td><td class="num">—</td></tr>`;
  rows += `<tr><td>bootstrap</td><td class="num" style="font-size:10px">${boot.mode}</td><td class="num">—</td></tr>`;
  rows += `<tr><td>CI método</td><td class="num" style="font-size:10px">${ciMethod}</td><td class="num">—</td></tr>`;

  $('paramTable').innerHTML = `
    <table>
      <tr><th>Parámetro</th><th class="num">Est.</th><th class="num">CI 95%</th></tr>
      ${rows}
    </table>`;
}

function renderVerdict(){
  if(!State.diagnostics) return;
  const v = State.diagnostics.verdict;
  $('verdict').innerHTML = `
    <div class="verdict ${v.level}">
      <strong>${v.label}</strong>${v.msg}
    </div>`;
}

function renderDiagnostics(){
  if(!State.diagnostics) return;
  const { range, r, kappa } = State.diagnostics;
  const absR = Math.abs(r);
  const rCls = absR > 0.98 ? 'bad' : absR > 0.9 ? 'warn' : 'ok';
  const dCls = range.decades < 1.5 ? 'bad' : range.decades < 3 ? 'warn' : 'ok';
  const kCls = kappa > 1e4 ? 'bad' : kappa > 1e2 ? 'warn' : 'ok';
  $('diagnostics').innerHTML = `
    <div class="metric"><span class="label">Décadas</span><span class="value ${dCls}">${range.decades.toFixed(2)}</span></div>
    <div class="metric"><span class="label">r(p1,p2)</span><span class="value ${rCls}">${r.toFixed(4)}</span></div>
    <div class="metric"><span class="label">κ(H)</span><span class="value ${kCls}">${isFinite(kappa) ? kappa.toExponential(2) : '∞'}</span></div>
    <div class="metric"><span class="label">N puntos</span><span class="value">${active().points.length}</span></div>`;
}

function renderManifest(){
  const box = $('manifestBox');
  if(!State.manifest){
    box.innerHTML = '<div class="muted">Sin manifest (Web Crypto no disponible o hash falló).</div>';
    return;
  }
  const m = State.manifest;
  box.innerHTML = `
    <div class="metric"><span class="label">run_id</span><span class="value" style="font-size:10px">${m.runId.slice(0, 16)}…</span></div>
    <div class="metric"><span class="label">seed</span><span class="value">${m.seed}</span></div>
    <div class="metric"><span class="label">model</span><span class="value">${m.modelId}</span></div>
    <div class="metric"><span class="label">dataset</span><span class="value" style="font-size:10px">${m.datasetHash.slice(0, 16)}…</span></div>
    <div class="metric"><span class="label">config</span><span class="value" style="font-size:10px">${m.configHash.slice(0, 16)}…</span></div>
    <div class="metric"><span class="label">ts</span><span class="value" style="font-size:10px">${m.timestamp}</span></div>
    <div class="note">run_id = SHA-256(seed ‖ modelo ‖ dataset ‖ config). Reproducible mientras esos cuatro no cambien.</div>`;
}

function fmt(v){
  if(!isFinite(v)) return '—';
  if(Math.abs(v) >= 1e4 || (Math.abs(v) < 1e-3 && v !== 0)) return v.toExponential(3);
  return v.toFixed(3);
}

function downloadFile(name, content, type = 'application/octet-stream'){
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============================================================
   §15  TESTS
   ============================================================
   Cobertura: álgebra lineal, modelos, fitter, bootstrap (paramétrico
   y residual), perfil, extrapolación, BCa. Los mensajes del banner
   reflejan esta cobertura.
   ============================================================ */

function runTests(){
  const results = [];
  const log = (name, pass, detail) => {
    results.push({ name, pass });
    console.log(`[test] ${pass?'✓':'✗'} ${name}`, detail || '');
  };

  // 1. solveLinear
  try {
    const x = solveLinear([[2,1],[1,3]], [5,10]);
    log('solveLinear 2×2', x && Math.abs(x[0]-1)<1e-9 && Math.abs(x[1]-3)<1e-9, x);
  } catch(e){ log('solveLinear 2×2', false, e.message); }

  // 2. solveQR
  try {
    const A = [[1,2],[3,4],[5,6]];
    const b = [1,2,3];
    const x = solveQR(A, b);
    const res = A.map((row,i) => row[0]*x[0] + row[1]*x[1] - b[i]);
    const norm = Math.sqrt(res.reduce((s,r)=>s+r*r,0));
    log('solveQR 3×2', x && norm < 1, norm);
  } catch(e){ log('solveQR 3×2', false, e.message); }

  // 3. Hill2 en x=K da 0.5
  try {
    const y = MODELS.hill2.eval([Math.log(2), 1.5], 2);
    log('hill2(x=K)=0.5', Math.abs(y - 0.5) < 1e-9, y);
  } catch(e){ log('hill2(x=K)=0.5', false, e.message); }

  // 4. Fitter recupera parámetros conocidos
  try {
    const xs = [0.01, 0.05, 0.1, 0.3, 1, 3, 10, 30, 100, 300, 1000];
    const ys = xs.map(x => MODELS.hill2.eval([Math.log(1), 2], x));
    const fit = Fitter.fit(xs, ys, null, MODELS.hill2);
    const Kest = Math.exp(fit.params[0]);
    log('fitter recupera K=1, α=2',
      Math.abs(Kest - 1) < 0.1 && Math.abs(fit.params[1] - 2) < 0.1,
      { Kest, alpha: fit.params[1] });
  } catch(e){ log('fitter recupera K=1, α=2', false, e.message); }

  // 5. Pesos null-safety
  try {
    const xs = [0.1, 1, 10];
    const ys = [0.1, 0.5, 0.9];
    const ws = [null, 2, null];
    const rss = Fitter.rss(xs, ys, [Math.log(5), 1], ws, MODELS.hill2);
    log('rss acepta ws con null', isFinite(rss) && rss >= 0, rss);
  } catch(e){ log('rss acepta ws con null', false, e.message); }

  // 6. Bootstrap paramétrico
  try {
    const rng = createPrng(123);
    const xs = [0.1, 0.3, 1, 3, 10, 30, 100];
    const ys = xs.map(x => clamp01(MODELS.hill2.eval([Math.log(1), 2], x) + gaussian(rng)*0.02));
    const fit = Fitter.fit(xs, ys, null, MODELS.hill2);
    const boot = Bootstrap.run(xs, ys, null, null, fit.params, MODELS.hill2, 30, createPrng(456), 'parametric');
    const ok = boot.all.length === 30
      && boot.primary.length === 2
      && boot.primary[0].length === 30
      && boot.mode === 'parametric';
    log('bootstrap paramétrico', ok, { n: boot.all.length, mode: boot.mode });
  } catch(e){ log('bootstrap paramétrico', false, e.message); }

  // 7. Bootstrap residual con réplicas
  try {
    const rng = createPrng(789);
    const xs = [0.5, 0.5, 1, 1, 3, 3, 10, 10];
    const ys = xs.map(x => clamp01(MODELS.hill2.eval([Math.log(1), 2], x) + gaussian(rng)*0.03));
    const fit = Fitter.fit(xs, ys, null, MODELS.hill2);
    const boot = Bootstrap.run(xs, ys, null, null, fit.params, MODELS.hill2, 20, rng, 'auto');
    log('bootstrap residual (réplicas)', boot.mode === 'residual', boot.mode);
  } catch(e){ log('bootstrap residual (réplicas)', false, e.message); }

  // 8. Profile likelihood produce CI
  try {
    const rng = createPrng(999);
    const xs = [0.01, 0.03, 0.1, 0.3, 1, 3, 10, 30, 100, 300];
    const ys = xs.map(x => clamp01(MODELS.hill2.eval([Math.log(1), 2], x) + gaussian(rng)*0.02));
    const fit = Fitter.fit(xs, ys, null, MODELS.hill2);
    const prof = profileLikelihood(xs, ys, null, fit.params, MODELS.hill2, 0, 3, 20);
    const ok = prof.ciLo != null && prof.ciHi != null && prof.ciHi > prof.ciLo;
    log('profile likelihood produce CI', ok, { lo: prof.ciLo, hi: prof.ciHi });
  } catch(e){ log('profile likelihood produce CI', false, e.message); }

  // 9. Extrapolación produce curva descendente
  try {
    const rng = createPrng(111);
    const xs = [0.1, 0.3, 1, 3, 10, 30, 100];
    const ys = xs.map(x => clamp01(MODELS.hill2.eval([Math.log(10), 2], x) + gaussian(rng)*0.02));
    const fit = Fitter.fit(xs, ys, null, MODELS.hill2);
    const curve = extrapolationCurve(xs, ys, fit.params, MODELS.hill2, createPrng(222), 'augment');
    const ok = curve && curve.length >= 5 && curve[curve.length-1].r < curve[0].r + 0.05;
    log('extrapolación produce curva', ok,
      curve ? { first: curve[0].r, last: curve[curve.length-1].r } : null);
  } catch(e){ log('extrapolación produce curva', false, e.message); }

  // 10. BCa CI ordenado
  try {
    const rng = createPrng(333);
    const cloud = Array.from({length: 100}, () => 0.5 + gaussian(rng)*0.1);
    const jack = Array.from({length: 20}, () => 0.5 + gaussian(rng)*0.1);
    const ci = Bootstrap.bcaCI(cloud, 0.5, jack, 0.05);
    const ok = ci[0] < ci[1] && isFinite(ci[0]) && isFinite(ci[1]);
    log('BCa CI ordenado', ok, ci);
  } catch(e){ log('BCa CI ordenado', false, e.message); }

  // 11. Parser con comentarios inline
  try {
    const { points, errors } = parseDataText(
      '0.1, 0.02  # primer punto\n1.0, 0.31 # segundo\n# línea entera\n3.0, 0.72\n10, 0.94'
    );
    const ok = points.length === 4 && errors.length === 0;
    log('parser con comentarios inline', ok, { n: points.length, errors: errors.length });
  } catch(e){ log('parser con comentarios inline', false, e.message); }

  return results;
}

function showTests(results){
  const banner = $('testBanner');
  const failed = results.filter(r => !r.pass);
  if(failed.length === 0){
    banner.innerHTML = `<div class="verdict ok"><strong>✓ ${results.length} tests pasados</strong>
      Cubren álgebra lineal, modelos, fitter, bootstrap (paramétrico y residual), perfil, extrapolación, BCa, parser.</div>`;
  } else {
    banner.innerHTML = `<div class="verdict danger"><strong>✗ ${failed.length} de ${results.length} fallidos</strong>Revisa la consola.</div>`;
  }
}

/* ============================================================
   §16  PRESETS
   ============================================================ */

function genPoints(K, alpha, xMin, xMax, n, noise, seed = 1){
  const rng = createPrng(seed);
  const pts = [];
  const lgMin = Math.log10(xMin), lgMax = Math.log10(xMax);
  for(let i=0; i<n; i++){
    const lgx = lgMin + (lgMax-lgMin)*i/(n-1);
    const x = Math.pow(10, lgx);
    const xn = Math.pow(x, alpha), Kn = Math.pow(K, alpha);
    const yTrue = xn / (xn + Kn);
    pts.push({ x, y: clamp01(yTrue + gaussian(rng)*noise), sigma: null, n: 1 });
  }
  return pts;
}

const PRESETS = {
  optimal: { name:'Óptimo · 4 déc.', model:'hill2',
    gen: () => genPoints(1, 2, 0.01, 100, 20, 0.02, 1) },
  degenerate: { name:'Degenerado', model:'hill2',
    gen: () => genPoints(10, 2, 0.01, 1.0, 15, 0.02, 2) },
  veryDegenerate: { name:'Muy degenerado', model:'hill2',
    gen: () => genPoints(100, 2, 0.1, 3.0, 15, 0.02, 3) },
  noisy: { name:'Ruidoso', model:'hill2',
    gen: () => genPoints(1, 1.5, 0.05, 20, 12, 0.05, 4) },
  gompertzDemo: { name:'Gompertz', model:'gompertz',
    gen: () => {
      const rng = createPrng(7);
      const pts = [];
      for(let i=0; i<20; i++){
        const x = Math.pow(10, -1 + 3*i/19);
        const y = clamp01(0.9 * Math.exp(-Math.exp(-(x-5)/2)) + gaussian(rng)*0.02);
        pts.push({ x, y, sigma: null, n: 1 });
      }
      return pts;
    } },
};

/* ============================================================
   §17  INIT
   ============================================================ */

async function init(){
  const compute = new ComputeClient();
  // Guardar referencia para limpieza en beforeunload.
  window.__cascabelCompute = compute;

  try {
    await compute.registerModels();
  } catch(e){
    console.error('Worker init falló:', e);
    toast('El worker no arrancó. Revisa la consola.', 5000);
  }

  const sel = $('modelSelect');
  for(const id in MODELS){
    const opt = document.createElement('option');
    opt.value = id; opt.textContent = MODELS[id].name;
    sel.appendChild(opt);
  }
  sel.value = State.model;
  $('modelNote').textContent = MODELS[State.model].note;
  sel.addEventListener('change', async () => {
    State.model = sel.value;
    $('modelNote').textContent = MODELS[State.model].note;
    if($('dataInput').value.trim()) await fitAll(compute);
  });

  const pDiv = $('presets');
  for(const key in PRESETS){
    const p = PRESETS[key];
    const b = document.createElement('button');
    b.style.flex = '1 1 45%';
    b.textContent = p.name;
    b.onclick = async () => {
      State.model = p.model;
      sel.value = p.model;
      $('modelNote').textContent = MODELS[p.model].note;
      const pts = p.gen();
      $('dataInput').value = pointsToText(pts);
      await fitAll(compute);
    };
    pDiv.appendChild(b);
  }

  $('fitBtn').onclick = () => fitAll(compute);
  $('extrapolateBtn').onclick = () => extrapolate();
  $('runTestsBtn').onclick = () => showTests(runTests());

  $('saveBtn').onclick = async () => {
    try {
      await Storage.save('current', {
        model: State.model,
        seed: State.seed,
        points: active() ? active().points : [],
        timestamp: Date.now(),
      });
      toast('Guardado');
      $('dbNote').textContent = `Último guardado: ${new Date().toLocaleTimeString()}`;
    } catch(e){ toast('Error al guardar: ' + e.message); }
  };

  $('loadBtn').onclick = async () => {
    try {
      const s = await Storage.load('current');
      if(!s){ toast('Nada guardado'); return; }
      State.model = s.model;
      State.seed = s.seed;
      sel.value = s.model;
      $('modelNote').textContent = MODELS[s.model].note;
      $('seedInput').value = s.seed;
      $('dataInput').value = pointsToText(s.points);
      await fitAll(compute);
      toast('Cargado');
    } catch(e){ toast('Error al cargar: ' + e.message); }
  };

  $('clearDbBtn').onclick = async () => {
    try {
      await Storage.delete('current');
      $('dbNote').textContent = 'IndexedDB · sin guardados';
      toast('Borrado');
    } catch(e){ toast('Error al borrar: ' + e.message); }
  };

  $('exportJsonBtn').onclick = () => {
    const d = active();
    if(!d) return;
    const payload = {
      version: '1.0',
      manifest: State.manifest,
      model: State.model,
      seed: State.seed,
      points: d.points,
      fit: d.fit ? { params: d.fit.params, rss: d.fit.rss, converged: d.fit.converged } : null,
      diagnostics: State.diagnostics,
    };
    downloadFile('cascabel_run.json', JSON.stringify(payload, null, 2), 'application/json');
  };

  $('exportBootstrapBtn').onclick = () => {
    const d = active();
    if(!d || !d.bootstrap){ toast('Sin bootstrap'); return; }
    const model = MODELS[State.model];
    const header = model.paramNames.join(',');
    const rows = d.bootstrap.all.map(s => s.map(v => v.toFixed(8)).join(','));
    downloadFile('bootstrap.csv', [header, ...rows].join('\n'), 'text/csv');
  };

  $('seedInput').value = State.seed;
  $('reseedBtn').onclick = () => {
    State.seed = Math.floor(Math.random() * 1e9);
    $('seedInput').value = State.seed;
    toast(`Nueva semilla: ${State.seed}`);
  };
  $('seedInput').addEventListener('change', () => {
    State.seed = parseInt($('seedInput').value, 10) || 0;
  });

  const pts = PRESETS.degenerate.gen();
  $('dataInput').value = pointsToText(pts);
  State.datasets = [{ id:'A', points: pts, fit:null, bootstrap:null, jackknife:null, color:DATASET_COLORS.A }];

  showTests(runTests());

  if(!crypto.subtle){
    toast('Web Crypto no disponible (necesita https/localhost).', 5000);
  }
}

// Cleanup del worker al cerrar. Sin esto, el Blob URL y el worker
// quedan vivos hasta que el documento se descarga.
window.addEventListener('beforeunload', () => {
  if(window.__cascabelCompute){
    window.__cascabelCompute.terminate();
    window.__cascabelCompute = null;
  }
});

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
